name: Quick Reimbursement and Purchasing Preflight
on:
  push:
    branches: ["codex/quick-reimbursement-v134285"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: hongmeng_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/hongmeng_ci?schema=public
      DAILY_PLAN_ENABLED: 'true'
      SESSION_SECRET: disposable-purchasing-selection-session-2026-1234567890
      APP_BASE_URL: http://127.0.0.1:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install Chinese fonts for visual acceptance
        timeout-minutes: 3
        run: sudo apt-get -o Acquire::ForceIPv4=true -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 -o Acquire::Retries=1 install -y fonts-noto-cjk
      - run: npm ci
      - run: npx prisma generate && npx prisma migrate deploy
      - name: Focused unit and transaction regressions
        run: |
          npx tsx --test tests/purchasing-selection.test.ts tests/purchasing-reimbursement.test.ts tests/submodule-permissions.test.ts tests/access-data-contracts.test.ts tests/release-version.test.ts
          RUN_DB_INTEGRATION=1 npx tsx --test --test-concurrency=1 tests/purchasing-selection-integration.test.ts tests/purchasing-reimbursement-integration.test.ts tests/purchasing-integration.test.ts tests/purchasing-batch-payment-integration.test.ts tests/purchasing-amount-correction-integration.test.ts
      - run: npm run build
      - name: Real browser acceptance on isolated production build
        run: |
          set -euo pipefail
          mkdir -p artifacts/purchasing-selection
          node node_modules/next/dist/bin/next start --hostname 127.0.0.1 -p 3000 > artifacts/purchasing-selection/server.log 2>&1 &
          app_pid=$!
          trap 'kill "$app_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3000/login >/dev/null; then break; fi
            sleep 2
          done
          bash scripts/check-purchasing-selection.sh release
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: purchasing-selection-preflight
          path: |
            artifacts/purchasing-selection/*.log
            output/playwright/purchasing-selection*/*.png
            output/playwright/purchasing-selection*/browser-result.json
            output/playwright/purchasing-selection*/browser-runtime.txt
            output/playwright/purchasing-selection*/selected.xlsx
