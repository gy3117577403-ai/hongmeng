name: Shipping Report Preflight
on:
  push:
    branches: ["codex/shipping-reports-v134242"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: shipping-report-preflight
  cancel-in-progress: true
jobs:
  shipping-report-check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: hongmeng_shipping_report_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/hongmeng_shipping_report_ci?schema=public
      DAILY_PLAN_ENABLED: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx prisma validate && npx prisma generate && npx prisma migrate deploy
      - run: npx tsc --noEmit
      - run: npm run test:unit
      - name: Receipt, history and idempotency database acceptance
        run: RUN_DB_INTEGRATION=1 npx tsx --test --test-concurrency=1 tests/shipping-report-integration.test.ts
      - run: npm run build
      - name: Real PDF, object storage and browser acceptance
        env:
          SESSION_SECRET: shipping-report-disposable-session-12345678901234567890
          APP_BASE_URL: http://127.0.0.1:3000
          S3_ENDPOINT: http://127.0.0.1:19000
          S3_PUBLIC_ENDPOINT: http://127.0.0.1:19000
          S3_BUCKET: workorder-resources
          S3_REGION: auto
          S3_FORCE_PATH_STYLE: "true"
          S3_ACCESS_KEY_ID: shippingqaaccess
          S3_SECRET_ACCESS_KEY: shipping-qa-storage-only-12345678
          SHIPPING_QA_ALLOW: disposable-shipping-reports
          SHIPPING_QA_FIXTURE: /tmp/shipping-report-fixture.json
          SHIPPING_QA_OUTPUT: output/playwright/shipping-report
        run: |
          set -euo pipefail
          bash scripts/pull-ci-minio.sh
          docker run -d --name shipping-storage --network host -e MINIO_ROOT_USER="$S3_ACCESS_KEY_ID" -e MINIO_ROOT_PASSWORD="$S3_SECRET_ACCESS_KEY" hongmeng-ci-minio:verified-a1a8bd4ac40a server /data --address :19000
          SMOKE_STORAGE_ALLOW=disposable-ci-storage node scripts/prepare-smoke-storage.mjs
          node scripts/seed-shipping-report-smoke.cjs
          npm run start > shipping-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true; docker rm -f shipping-storage >/dev/null' EXIT
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:3000/api/ready >/dev/null; then break; fi
            sleep 2
          done
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk poppler-utils
          npx --yes --package @playwright/cli@0.1.19 playwright-cli install-browser chrome
          node scripts/smoke-shipping-report-browser.mjs
          for pdf in output/playwright/shipping-report/*.pdf; do pdftoppm -scale-to 1500 -singlefile -png "$pdf" "${pdf%.pdf}"; pdftotext -layout "$pdf" "${pdf%.pdf}.txt"; done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shipping-report-preflight
          path: |
            output/playwright/shipping-report
            shipping-server.log
