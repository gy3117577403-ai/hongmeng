name: Sample Branch Preflight
on:
  push:
    branches: ["codex/sample-planning-realignment-v134232", "codex/drawing-replacement-v134223", "codex/sample-branches-v134218", "codex/sample-planning-warehouse-v134220", "codex/sample-unified-workbench-v134221"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sample-check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: hongmeng_sample_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/hongmeng_sample_ci?schema=public
      RUN_DB_INTEGRATION: "1"
      DAILY_PLAN_ENABLED: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma migrate deploy
      - run: npx tsc --noEmit
      - run: npm run test:sample-integration
      - run: npm run test:material-follow-up-integration
      - run: npx tsx --test --test-concurrency=1 tests/drawing-plan-week-integration.test.ts tests/finished-goods-integration.test.ts tests/drawing-replacement-integration.test.ts
      - run: npm run build
      - name: Real sample HTTP and storage acceptance
        env:
          SESSION_SECRET: sample-branch-ci-session-key-only-1234567890
          SEED_ADMIN_USERNAME: samplebranchqa
          SEED_ADMIN_PASSWORD: Codex-SBR-Seed-QA-2026!Z
          SAMPLE_BRANCH_INITIAL_PASSWORD: Codex-SBR-Seed-QA-2026!Z
          SMOKE_ADMIN_CHANGED_PASSWORD: Codex-SBR-Changed-QA-2026!R
          S3_ENDPOINT: http://127.0.0.1:19000
          S3_PUBLIC_ENDPOINT: http://127.0.0.1:19000
          S3_BUCKET: workorder-resources
          S3_REGION: auto
          S3_FORCE_PATH_STYLE: "true"
          S3_ACCESS_KEY_ID: samplebranchstorage
          S3_SECRET_ACCESS_KEY: sample-branch-ci-storage-only-123456
          APP_BASE_URL: http://127.0.0.1:3000
          SAMPLE_BRANCH_QA_ALLOW: disposable-sample-branches
          SAMPLE_PLAN_BROWSER_FIXTURE: /tmp/sample-planning-fixture.json
        run: |
          set -euo pipefail
          bash scripts/pull-ci-minio.sh
          docker run -d --name sample-branch-storage --network host -e MINIO_ROOT_USER="$S3_ACCESS_KEY_ID" -e MINIO_ROOT_PASSWORD="$S3_SECRET_ACCESS_KEY" hongmeng-ci-minio:verified-a1a8bd4ac40a server /data --address :19000
          SMOKE_STORAGE_ALLOW=disposable-ci-storage node scripts/prepare-smoke-storage.mjs
          npm run prisma:seed
          npm run start > sample-branch-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" || true; docker rm -f sample-branch-storage >/dev/null' EXIT
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:3000/api/ready >/dev/null; then break; fi
            sleep 2
          done
          node scripts/smoke-sample-branches.mjs
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk
          npx --yes --package @playwright/cli@0.1.19 playwright-cli install-browser chrome
          node scripts/smoke-sample-planning-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sample-branches-preflight
          path: |
            output/playwright/sample-planning
            artifacts/sample-branches
            sample-branch-server.log
