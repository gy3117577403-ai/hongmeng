        with:
          name: planning-progress-preview-acceptance
          path: artifacts/planning-progress-preview/*
          if-no-files-found: ignore
      - name: Upload quality data acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-data-acceptance
          path: artifacts/quality-data-v1/*runtime.json
          if-no-files-found: ignore
      - name: Upload process inspection acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: process-quality-${{ github.ref_name }}
          path: |
            artifacts/process-quality/*http.json
            artifacts/process-quality/browser-runtime.txt
            artifacts/process-quality/*.png
          if-no-files-found: warn

      - name: Upload four-position blade acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: terminal-blade-acceptance
          path: |
            artifacts/terminal-tooling/*http.json
            artifacts/terminal-tooling/**/*runtime.txt
            artifacts/terminal-tooling/**/*.png
            artifacts/terminal-tooling/**/*.csv
          if-no-files-found: warn
