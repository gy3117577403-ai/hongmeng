name: Docker Image
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
concurrency:
  group: docker-image-release
  cancel-in-progress: false
permissions:
  contents: read
  packages: write
jobs:
  build-and-push:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: hongmeng_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d hongmeng_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/hongmeng_ci?schema=public
      DAILY_PLAN_ENABLED: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Verify release tag matches package version
        run: |
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          test "$GITHUB_REF_NAME" = "v$PACKAGE_VERSION"
      - name: Install dependencies
        run: npm ci
      - name: Validate Prisma schema
        run: npx prisma validate
      - name: Generate Prisma client
        run: npx prisma generate
      - name: Apply Prisma migrations
        run: npx prisma migrate deploy
      - name: Verify Prisma migration status
        run: npx prisma migrate status
      - name: Daily plan PostgreSQL integration
        env:
          RUN_DB_INTEGRATION: "1"
        run: npm run test:daily-plan-integration
      - name: Daily shipment PostgreSQL integration
        env:
          RUN_DB_INTEGRATION: "1"
        run: npm run test:daily-shipment-integration
      - name: Issue work order PostgreSQL integration
        env:
          RUN_DB_INTEGRATION: "1"
        run: npm run test:issue-work-order-integration
      - name: Major quality approval PostgreSQL integration
        env:
          RUN_DB_INTEGRATION: "1"
        run: npx tsx --test --test-concurrency=1 tests/major-quality-approval-integration.test.ts
      - name: Employee password field-report PostgreSQL integration
        env:
          RUN_DB_INTEGRATION: "1"
        run: npx tsx --test --test-concurrency=1 tests/field-report-password-integration.test.ts
      - name: Field abnormal-time PostgreSQL integration
        env:
          RUN_DB_INTEGRATION: "1"
        run: npx tsx --test --test-concurrency=1 tests/field-abnormal-time-integration.test.ts
      - name: QR traveler print PostgreSQL integration
        env:
          RUN_DB_INTEGRATION: "1"
        run: npx tsx --test --test-concurrency=1 tests/field-report-qr-integration.test.ts
      - name: Warehouse and material follow-up PostgreSQL integration
        env:
          RUN_DB_INTEGRATION: "1"
        run: npm run test:material-follow-up-integration
      - name: Warehouse and material follow-up consistency audit
        run: npm run audit:material-follow-up-sync -- --json
      - name: Employee number reorder PostgreSQL integration
        env:
          RUN_EMPLOYEE_REORDER_INTEGRATION: "1"
        run: npm run test:employee-number-integration
      - name: Production plan auto-release PostgreSQL integration
        env:
          RUN_DB_INTEGRATION: "1"
        run: npm run test:planning-integration
      - name: Production carryover and test-week retirement PostgreSQL integration
        env:
          RUN_DB_INTEGRATION: "1"
        run: npx tsx --test --test-concurrency=1 tests/production-carryover.test.ts tests/production-carryover-integration.test.ts tests/production-test-data-retirement-integration.test.ts
      - name: Production correction and product-time sync PostgreSQL integration
        env:
          RUN_DB_INTEGRATION: "1"
        run: npx tsx --test --test-concurrency=1 tests/process-completion-withdrawal-integration.test.ts tests/product-time-active-sync-integration.test.ts
      - name: Process route change PostgreSQL integration
        env:
          RUN_DB_INTEGRATION: "1"
        run: npx tsx --test --test-concurrency=1 tests/process-route-change-integration.test.ts tests/process-route-change-review-lifecycle-integration.test.ts tests/process-route-change-move-integration.test.ts tests/process-route-change-duplicate-occurrence-integration.test.ts tests/process-completion-supplement-flow-integration.test.ts tests/product-time-full-deployment-integration.test.ts tests/product-time-deployment-version-conflict-integration.test.ts
      - name: Advance reporting and automatic labor PostgreSQL integration
        env:
          RUN_DB_INTEGRATION: "1"
        run: npx tsx --test --test-concurrency=1 tests/advance-reporting-integration.test.ts tests/process-action-reporting-integration.test.ts
      - name: Terminal tooling PostgreSQL integration
        env:
          RUN_DB_INTEGRATION: "1"
        run: npx tsx --test --test-concurrency=1 tests/terminal-tooling-integration.test.ts
      - name: Sample team PostgreSQL integration
        env:
          RUN_DB_INTEGRATION: "1"
        run: npm run test:sample-integration
      - name: Type check
        run: npx tsc --noEmit
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm run test:unit
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=tag
            type=raw,value=latest
            type=sha
          labels: |
            org.opencontainers.image.title=hongmeng-workorder-resource
            org.opencontainers.image.version=v1.34.20
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          build-args: |
            APP_VERSION=v1.34.20
            APP_REVISION=${{ github.sha }}
          load: true
          push: false
          tags: hongmeng-release-smoke:${{ github.sha }}
          labels: ${{ steps.meta.outputs.labels }}
      - name: Verify PDF.js runtime assets
        run: |
          docker run --rm --entrypoint /bin/sh hongmeng-release-smoke:${{ github.sha }} -c \
            'test -s /app/node_modules/pdfjs-dist/legacy/build/pdf.worker.mjs && test -s /app/node_modules/pdfjs-dist/legacy/build/pdf.worker.min.mjs'
      - name: Verify runtime origin guard
        run: |
          docker run --rm --entrypoint node \
            -e APP_BASE_URL=https://example.com \
            hongmeng-release-smoke:${{ github.sha }} scripts/validate-runtime-env.mjs
          if docker run --rm --entrypoint node \
            -e APP_BASE_URL=http://https://example.com \
            hongmeng-release-smoke:${{ github.sha }} scripts/validate-runtime-env.mjs; then
            echo "Malformed APP_BASE_URL was accepted" >&2
            exit 1
          fi
      - name: Smoke test exact release image
        env:
          OUTBOX_WORKER_TOKEN: ci-process-route-change-outbox-worker-token-1234567890
          SESSION_SECRET: ci-release-smoke-session-secret-1234567890
          SEED_ADMIN_USERNAME: pdfsmokeadmin
          SEED_ADMIN_PASSWORD: Codex-V13415-CI-Seed-Password-2026!Z
          SMOKE_ADMIN_CHANGED_PASSWORD: Codex-PDF-Smoke-Changed-2026!R
          S3_ACCESS_KEY_ID: pdfsmokeaccess
          S3_SECRET_ACCESS_KEY: Codex-V13415-MinIO-Secret-2026!Z
        run: |
          docker run -d --name hongmeng-release-minio --network host \
            -e MINIO_ROOT_USER="$S3_ACCESS_KEY_ID" \
            -e MINIO_ROOT_PASSWORD="$S3_SECRET_ACCESS_KEY" \
            minio/minio:latest server /data --address :19000 --console-address :19001
          cleanup() {
            docker rm -f hongmeng-release-smoke >/dev/null 2>&1 || true
            docker rm -f hongmeng-release-minio >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          minio_ready=0
          for attempt in $(seq 1 30); do
            if docker run --rm --network host minio/mc:latest \
              alias set smoke http://127.0.0.1:19000 "$S3_ACCESS_KEY_ID" "$S3_SECRET_ACCESS_KEY" >/dev/null 2>&1; then
              minio_ready=1
              break
            fi
            sleep 2
          done
          if [ "$minio_ready" != "1" ]; then
            docker logs hongmeng-release-minio
            exit 1
          fi
          docker run --rm --network host --entrypoint /bin/sh minio/mc:latest -c \
            "mc alias set smoke http://127.0.0.1:19000 '$S3_ACCESS_KEY_ID' '$S3_SECRET_ACCESS_KEY' >/dev/null && mc mb -p smoke/workorder-resources"
          docker run -d --name hongmeng-release-smoke --network host \
            -e DATABASE_URL="$DATABASE_URL" \
            -e SESSION_SECRET="$SESSION_SECRET" \
            -e SEED_ADMIN_USERNAME="$SEED_ADMIN_USERNAME" \
            -e SEED_ADMIN_PASSWORD="$SEED_ADMIN_PASSWORD" \
            -e S3_ENDPOINT=http://127.0.0.1:19000 \
            -e S3_PUBLIC_ENDPOINT=http://127.0.0.1:19000 \
            -e S3_REGION=auto \
            -e S3_BUCKET=workorder-resources \
            -e S3_ACCESS_KEY_ID="$S3_ACCESS_KEY_ID" \
            -e S3_SECRET_ACCESS_KEY="$S3_SECRET_ACCESS_KEY" \
            -e S3_FORCE_PATH_STYLE=true \
            -e PROCESS_ROUTE_CHANGE_OUTBOX_WORKER_TOKEN="$OUTBOX_WORKER_TOKEN" \
            -e PROCESS_ROUTE_CHANGE_OUTBOX_POLL_SECONDS=2 \
            hongmeng-release-smoke:${{ github.sha }}
          ready=0
          for attempt in $(seq 1 60); do
            if curl --fail --silent --show-error http://127.0.0.1:3000/login >/dev/null; then
              ready=1
              break
            fi
            sleep 2
          done
          if [ "$ready" != "1" ]; then
            docker logs hongmeng-release-smoke
            exit 1
          fi
          curl --fail --silent --show-error \
            -X POST \
            -H "x-outbox-worker-token: $OUTBOX_WORKER_TOKEN" \
            http://127.0.0.1:3000/api/internal/process-route-change-outbox >/dev/null
          APP_BASE_URL=http://127.0.0.1:3000 \
            SMOKE_ADMIN_USERNAME="$SEED_ADMIN_USERNAME" \
            SMOKE_ADMIN_PASSWORD="$SEED_ADMIN_PASSWORD" \
            SMOKE_ADMIN_CHANGED_PASSWORD="$SMOKE_ADMIN_CHANGED_PASSWORD" \
            node scripts/smoke-connector-manual-pdf.mjs
          docker stop --time 20 hongmeng-release-smoke >/dev/null
          test "$(docker inspect -f '{{.State.ExitCode}}' hongmeng-release-smoke)" = "0"
      - name: Push verified release image
        env:
          RELEASE_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          declare -A pushed_tags=()
          while IFS= read -r tag; do
            [ -n "$tag" ] || continue
            [ -z "${pushed_tags[$tag]:-}" ] || continue
            docker tag hongmeng-release-smoke:${{ github.sha }} "$tag"
            pushed=0
            for attempt in $(seq 1 5); do
              if docker push "$tag"; then
                pushed=1
                break
              fi
              echo "GHCR push failed for $tag ($attempt/5); retrying after $((attempt * 10)) seconds"
              sleep $((attempt * 10))
            done
            if [ "$pushed" != "1" ]; then
              echo "GHCR push failed after retries: $tag" >&2
              exit 1
            fi
            pushed_tags[$tag]=1
          done <<EOF
          $RELEASE_TAGS
          EOF
      - name: Verify Sealos China mirror matches GHCR
        env:
          UPSTREAM_IMAGE: ghcr.io/${{ github.repository }}:${{ github.ref_name }}
          SEALOS_IMAGE: ghcr.nju.edu.cn/${{ github.repository }}:${{ github.ref_name }}
        run: |
          upstream_digest="$(docker buildx imagetools inspect "$UPSTREAM_IMAGE" | awk '$1 == "Digest:" { print $2; exit }')"
          test -n "$upstream_digest"

          mirror_digest=""
          for attempt in $(seq 1 20); do
            mirror_digest="$(docker buildx imagetools inspect "$SEALOS_IMAGE" 2>/dev/null | awk '$1 == "Digest:" { print $2; exit }' || true)"
            if [ "$mirror_digest" = "$upstream_digest" ]; then
              break
            fi
            echo "Sealos mirror is not synchronized yet ($attempt/20)"
            sleep 15
          done

          if [ "$mirror_digest" != "$upstream_digest" ]; then
            echo "Sealos mirror digest mismatch: upstream=$upstream_digest mirror=${mirror_digest:-missing}" >&2
            exit 1
          fi

          {
            echo "### Sealos deployment image"
            echo
            echo "\`$SEALOS_IMAGE\`"
            echo
            echo "Verified digest: \`$upstream_digest\`"
          } >> "$GITHUB_STEP_SUMMARY"
