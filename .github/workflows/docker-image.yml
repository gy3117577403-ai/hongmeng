name: Docker Image
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
concurrency:
  group: docker-image-release
  cancel-in-progress: true
permissions:
  contents: read
  packages: write
jobs:
  build-and-push:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: hongmeng_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d hongmeng_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/hongmeng_ci?schema=public
      DAILY_PLAN_ENABLED: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Verify release tag matches package version
        run: |
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          test "$GITHUB_REF_NAME" = "v$PACKAGE_VERSION"
      - name: Install dependencies
        run: npm ci
      - name: Validate Prisma schema
        run: npx prisma validate
      - name: Generate Prisma client
        run: npx prisma generate
      - name: Apply Prisma migrations
        run: npx prisma migrate deploy
      - name: Verify Prisma migration status
        run: npx prisma migrate status
      - name: Production control pause and date PostgreSQL integration
        env:
          RUN_DB_INTEGRATION: "1"
        run: npx tsx --test --test-concurrency=1 tests/production-control-integration.test.ts
      - name: Training QR and feedback PostgreSQL integration
        env:
          RUN_DB_INTEGRATION: "1"
        run: npm run test:training-integration
      - name: Skill reference catalog PostgreSQL integration
        env:
          RUN_DB_INTEGRATION: "1"
        run: npm run test:skill-integration
      - name: Attendance business calendar PostgreSQL integration
        env:
          RUN_DB_INTEGRATION: "1"
        run: npm run test:attendance-calendar-integration
      - name: Daily plan PostgreSQL integration
        env:
          RUN_DB_INTEGRATION: "1"
        run: npm run test:daily-plan-integration
      - name: Daily shipment PostgreSQL integration
        env:
          RUN_DB_INTEGRATION: "1"
        run: npm run test:daily-shipment-integration
      - name: Issue work order PostgreSQL integration
        env:
          RUN_DB_INTEGRATION: "1"
        run: npm run test:issue-work-order-integration
      - name: Issue closure PostgreSQL integration
        env:
          RUN_DB_INTEGRATION: "1"
        run: npx tsx --test --test-concurrency=1 tests/issues.test.ts
      - name: 8D PDF archive PostgreSQL integration
        env:
          RUN_DB_INTEGRATION: "1"
        run: npm run test:eight-d-integration
      - name: Internal quality risk PostgreSQL integration
        env:
          RUN_DB_INTEGRATION: "1"
        run: npm run test:quality-risk-integration
      - name: Material library PostgreSQL integration
        env:
          RUN_DB_INTEGRATION: "1"
        run: npm run test:material-library-integration
      - name: Major quality approval PostgreSQL integration
        env:
          RUN_DB_INTEGRATION: "1"
        run: npx tsx --test --test-concurrency=1 tests/major-quality-approval-integration.test.ts
      - name: Employee password field-report PostgreSQL integration
        env:
          RUN_DB_INTEGRATION: "1"
        run: npx tsx --test --test-concurrency=1 tests/field-report-password-integration.test.ts
      - name: Duration-only abnormal-time PostgreSQL integration
        env:
          RUN_DB_INTEGRATION: "1"
        run: npx tsx --test --test-concurrency=1 tests/field-abnormal-time-integration.test.ts tests/abnormal-time-duration-review-integration.test.ts
      - name: QR traveler print PostgreSQL integration
        env:
          RUN_DB_INTEGRATION: "1"
        run: npx tsx --test --test-concurrency=1 tests/field-report-qr-integration.test.ts
      - name: Warehouse and material follow-up PostgreSQL integration
        env:
          RUN_DB_INTEGRATION: "1"
        run: npm run test:material-follow-up-integration
      - name: Warehouse and material follow-up consistency audit
        run: npm run audit:material-follow-up-sync -- --json
      - name: Employee number reorder PostgreSQL integration
        env:
          RUN_EMPLOYEE_REORDER_INTEGRATION: "1"
        run: npm run test:employee-number-integration
      - name: Production plan auto-release PostgreSQL integration
        env:
          RUN_DB_INTEGRATION: "1"
        run: npm run test:planning-integration
      - name: Semi-finished warehouse PostgreSQL integration
        env:
          RUN_DB_INTEGRATION: "1"
        run: npx tsx --test --test-concurrency=1 tests/material-execution-control-integration.test.ts tests/wip-warehouse-integration.test.ts tests/wip-attainment-integration.test.ts tests/production-wip-source-projection-integration.test.ts
      - name: Production carryover and test-week retirement PostgreSQL integration
        env:
          RUN_DB_INTEGRATION: "1"
        run: npx tsx --test --test-concurrency=1 tests/production-carryover.test.ts tests/production-carryover-integration.test.ts tests/production-test-data-retirement-integration.test.ts
      - name: Weekly plan Excel export PostgreSQL integration
        env:
          RUN_DB_INTEGRATION: "1"
        run: npm run test:weekly-plan-export-integration
      - name: Production correction and product-time sync PostgreSQL integration
        env:
          RUN_DB_INTEGRATION: "1"
        run: npx tsx --test --test-concurrency=1 tests/process-completion-withdrawal-integration.test.ts tests/product-time-active-sync-integration.test.ts tests/product-time-draft-sync-integration.test.ts tests/product-time-draft-rebuild-integration.test.ts
      - name: Process route change PostgreSQL integration
        env:
          RUN_DB_INTEGRATION: "1"
        run: npx tsx --test --test-concurrency=1 tests/process-route-change-integration.test.ts tests/process-route-change-review-lifecycle-integration.test.ts tests/process-route-change-move-integration.test.ts tests/process-route-change-duplicate-occurrence-integration.test.ts tests/process-completion-supplement-flow-integration.test.ts tests/product-time-full-deployment-integration.test.ts tests/product-time-in-progress-migration-integration.test.ts tests/full-workorder-supplement-rebaseline-integration.test.ts tests/product-time-deployment-version-conflict-integration.test.ts
      - name: System notification lifecycle PostgreSQL integration
        env:
          RUN_DB_INTEGRATION: "1"
        run: npx tsx --test --test-concurrency=1 tests/system-notification-lifecycle-integration.test.ts tests/process-route-notification-lifecycle-integration.test.ts
      - name: Advance reporting and automatic labor PostgreSQL integration
        env:
          RUN_DB_INTEGRATION: "1"
        run: npx tsx --test --test-concurrency=1 tests/advance-reporting-integration.test.ts tests/process-action-reporting-integration.test.ts
      - name: Terminal tooling PostgreSQL integration
        env:
          RUN_DB_INTEGRATION: "1"
        run: npx tsx --test --test-concurrency=1 tests/terminal-tooling-integration.test.ts
      - name: Sample team PostgreSQL integration
        env:
          RUN_DB_INTEGRATION: "1"
        run: npm run test:sample-integration
      - name: Type check
        run: npx tsc --noEmit
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm run test:unit
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=tag
            type=raw,value=latest
            type=sha
          labels: |
            org.opencontainers.image.title=hongmeng-workorder-resource
            org.opencontainers.image.version=${{ github.ref_name }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          build-args: |
            APP_VERSION=${{ github.ref_name }}
            APP_REVISION=${{ github.sha }}
          load: true
          push: false
          tags: hongmeng-release-smoke:${{ github.sha }}
          labels: ${{ steps.meta.outputs.labels }}
      - name: Verify PDF.js runtime assets
        run: |
          docker run --rm --entrypoint /bin/sh hongmeng-release-smoke:${{ github.sha }} -c \
            'test -s /app/node_modules/pdfjs-dist/legacy/build/pdf.worker.mjs && test -s /app/node_modules/pdfjs-dist/legacy/build/pdf.worker.min.mjs'
      - name: Verify runtime origin guard
        run: |
          docker run --rm --entrypoint node \
            -e APP_BASE_URL=https://example.com \
            hongmeng-release-smoke:${{ github.sha }} scripts/validate-runtime-env.mjs
          if docker run --rm --entrypoint node \
            -e APP_BASE_URL=http://https://example.com \
            hongmeng-release-smoke:${{ github.sha }} scripts/validate-runtime-env.mjs; then
            echo "Malformed APP_BASE_URL was accepted" >&2
            exit 1
          fi
      - name: Smoke test exact release image
        env:
          OUTBOX_WORKER_TOKEN: ci-process-route-change-outbox-worker-token-1234567890
          SESSION_SECRET: ci-release-smoke-session-secret-1234567890
          SEED_ADMIN_USERNAME: pdfsmokeadmin
          SEED_ADMIN_PASSWORD: Codex-V13415-CI-Seed-Password-2026!Z
          SMOKE_ADMIN_CHANGED_PASSWORD: Codex-PDF-Smoke-Changed-2026!R
          S3_ACCESS_KEY_ID: pdfsmokeaccess
          S3_SECRET_ACCESS_KEY: Codex-V13415-MinIO-Secret-2026!Z
        run: |
          docker run -d --name hongmeng-release-minio --network host \
            -e MINIO_ROOT_USER="$S3_ACCESS_KEY_ID" \
            -e MINIO_ROOT_PASSWORD="$S3_SECRET_ACCESS_KEY" \
            minio/minio:latest server /data --address :19000 --console-address :19001
          cleanup() {
            docker rm -f hongmeng-release-smoke >/dev/null 2>&1 || true
            docker rm -f hongmeng-release-minio >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          minio_ready=0
          for attempt in $(seq 1 30); do
            if docker run --rm --network host minio/mc:latest \
              alias set smoke http://127.0.0.1:19000 "$S3_ACCESS_KEY_ID" "$S3_SECRET_ACCESS_KEY" >/dev/null 2>&1; then
              minio_ready=1
              break
            fi
            sleep 2
          done
          if [ "$minio_ready" != "1" ]; then
            docker logs hongmeng-release-minio
            exit 1
          fi
          docker run --rm --network host --entrypoint /bin/sh minio/mc:latest -c \
            "mc alias set smoke http://127.0.0.1:19000 '$S3_ACCESS_KEY_ID' '$S3_SECRET_ACCESS_KEY' >/dev/null && mc mb -p smoke/workorder-resources"
          docker run -d --name hongmeng-release-smoke --network host \
            -e DATABASE_URL="$DATABASE_URL" \
            -e SESSION_SECRET="$SESSION_SECRET" \
            -e SEED_ADMIN_USERNAME="$SEED_ADMIN_USERNAME" \
            -e SEED_ADMIN_PASSWORD="$SEED_ADMIN_PASSWORD" \
            -e S3_ENDPOINT=http://127.0.0.1:19000 \
            -e S3_PUBLIC_ENDPOINT=http://127.0.0.1:19000 \
            -e S3_REGION=auto \
            -e S3_BUCKET=workorder-resources \
            -e S3_ACCESS_KEY_ID="$S3_ACCESS_KEY_ID" \
            -e S3_SECRET_ACCESS_KEY="$S3_SECRET_ACCESS_KEY" \
            -e S3_FORCE_PATH_STYLE=true \
            -e PROCESS_ROUTE_CHANGE_OUTBOX_WORKER_TOKEN="$OUTBOX_WORKER_TOKEN" \
            -e PROCESS_ROUTE_CHANGE_OUTBOX_POLL_SECONDS=2 \
            hongmeng-release-smoke:${{ github.sha }}
          ready=0
          for attempt in $(seq 1 60); do
            if curl --fail --silent --show-error http://127.0.0.1:3000/login >/dev/null; then
              ready=1
              break
            fi
            sleep 2
          done
          if [ "$ready" != "1" ]; then
            docker logs hongmeng-release-smoke
            exit 1
          fi
          curl --fail --silent --show-error \
            -X POST \
            -H "x-outbox-worker-token: $OUTBOX_WORKER_TOKEN" \
            http://127.0.0.1:3000/api/internal/process-route-change-outbox >/dev/null
          APP_BASE_URL=http://127.0.0.1:3000 \
            SMOKE_ADMIN_USERNAME="$SEED_ADMIN_USERNAME" \
            SMOKE_ADMIN_PASSWORD="$SEED_ADMIN_PASSWORD" \
            SMOKE_ADMIN_CHANGED_PASSWORD="$SMOKE_ADMIN_CHANGED_PASSWORD" \
            node scripts/smoke-connector-manual-pdf.mjs
          REPORT_QA_BASE=http://127.0.0.1:3000 \
            REPORT_QA_S3_ENDPOINT=http://127.0.0.1:19000 \
            REPORT_QA_EVIDENCE_PATH=artifacts/employee-reports-access-v13466/runtime-ci.json \
            node scripts/smoke-employee-reports-access.mjs
          ORIENTATION_QA_BASE=http://127.0.0.1:3000 \
            ORIENTATION_QA_EVIDENCE=artifacts/document-orientation-v13467/runtime-ci.json \
            node scripts/smoke-document-orientation.mjs
          CONTROL_QA_BASE=http://127.0.0.1:3000 \
            CONTROL_QA_EVIDENCE=artifacts/production-control-v13469/runtime-ci.json \
            node scripts/smoke-production-control.mjs
          ISSUE_QA_BASE=http://127.0.0.1:3000 \
            ISSUE_QA_EVIDENCE=artifacts/issue-closure-v13470/runtime-ci.json \
            node scripts/smoke-issue-closure.mjs
          DATABASE_URL=postgresql://postgres:postgres@localhost:5432/hongmeng_ci \
            WECOM_QA_BASE=http://127.0.0.1:3000 \
            PROCESS_ROUTE_CHANGE_OUTBOX_WORKER_TOKEN="$OUTBOX_WORKER_TOKEN" \
            node scripts/smoke-wecom-quality-only.mjs
          docker stop --time 20 hongmeng-release-smoke >/dev/null
          test "$(docker inspect -f '{{.State.ExitCode}}' hongmeng-release-smoke)" = "0"
      - name: Push verified release image
        id: push_release
        env:
          RELEASE_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          declare -A pushed_tags=()
          while IFS= read -r tag; do
            [ -n "$tag" ] || continue
            [ -z "${pushed_tags[$tag]:-}" ] || continue
            docker tag hongmeng-release-smoke:${{ github.sha }} "$tag"
            pushed=0
            for attempt in $(seq 1 5); do
              if docker push "$tag"; then
                pushed=1
                break
              fi
              echo "GHCR push failed for $tag ($attempt/5); retrying after $((attempt * 10)) seconds"
              sleep $((attempt * 10))
            done
            if [ "$pushed" != "1" ]; then
              echo "GHCR push failed after retries: $tag" >&2
              exit 1
            fi
            pushed_tags[$tag]=1
          done <<EOF
          $RELEASE_TAGS
          EOF
      - name: Verify China mirror manifest and blobs
        id: china_mirror
        continue-on-error: true
        timeout-minutes: 15
        env:
          UPSTREAM_IMAGE: ghcr.io/${{ github.repository }}:${{ github.ref_name }}
          CHINA_MIRROR_IMAGE: ghcr.dockerproxy.net/${{ github.repository }}:${{ github.ref_name }}
          CHINA_MIRROR_REGISTRY: ghcr.dockerproxy.net
          IMAGE_REPOSITORY: ${{ github.repository }}
          IMAGE_REFERENCE: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          upstream_digest="$(timeout 30s docker buildx imagetools inspect "$UPSTREAM_IMAGE" | awk '$1 == "Digest:" { print $2; exit }')"
          [[ "$upstream_digest" =~ ^sha256:[0-9a-f]{64}$ ]]

          mirror_digest=""
          for attempt in $(seq 1 4); do
            mirror_digest="$(timeout 30s docker buildx imagetools inspect "$CHINA_MIRROR_IMAGE" 2>/dev/null | awk '$1 == "Digest:" { print $2; exit }' || true)"
            if [ "$mirror_digest" = "$upstream_digest" ]; then
              break
            fi
            echo "China mirror is not synchronized yet ($attempt/4)"
            sleep 15
          done

          if [ "$mirror_digest" != "$upstream_digest" ]; then
            echo "China mirror digest mismatch: upstream=$upstream_digest mirror=${mirror_digest:-missing}" >&2
            exit 1
          fi

          manifest_file="$(mktemp)"
          blob_file="$(mktemp)"
          cleanup_mirror_files() {
            rm -f "$manifest_file" "$blob_file"
          }
          trap cleanup_mirror_files EXIT

          manifest_url="https://${CHINA_MIRROR_REGISTRY}/v2/${IMAGE_REPOSITORY}/manifests/${IMAGE_REFERENCE}"
          curl --fail --silent --show-error --location \
            --connect-timeout 10 --max-time 90 \
            --retry 5 --retry-all-errors --retry-delay 5 \
            -H 'Accept: application/vnd.oci.image.manifest.v1+json, application/vnd.docker.distribution.manifest.v2+json' \
            "$manifest_url" > "$manifest_file"

          downloaded_manifest_digest="sha256:$(sha256sum "$manifest_file" | awk '{ print $1 }')"
          if [ "$downloaded_manifest_digest" != "$upstream_digest" ]; then
            echo "Downloaded China mirror manifest digest mismatch: expected=$upstream_digest actual=$downloaded_manifest_digest" >&2
            exit 1
          fi

          mapfile -t blob_digests < <(jq -r '.config.digest, .layers[].digest' "$manifest_file")
          if [ "${#blob_digests[@]}" -lt 2 ]; then
            echo "China mirror manifest did not contain the expected config and layer blobs" >&2
            exit 1
          fi

          for digest in "${blob_digests[@]}"; do
            verified=0
            blob_url="https://${CHINA_MIRROR_REGISTRY}/v2/${IMAGE_REPOSITORY}/blobs/${digest}"
            for attempt in $(seq 1 5); do
              rm -f "$blob_file"
              if curl --fail --silent --show-error --location \
                --connect-timeout 10 --max-time 300 \
                --retry 3 --retry-all-errors --retry-delay 3 \
                "$blob_url" > "$blob_file"; then
                actual_digest="sha256:$(sha256sum "$blob_file" | awk '{ print $1 }')"
                if [ "$actual_digest" = "$digest" ]; then
                  verified=1
                  echo "Verified China mirror blob $digest ($(stat -c%s "$blob_file") bytes)"
                  break
                fi
                echo "China mirror blob digest mismatch ($attempt/5): expected=$digest actual=$actual_digest" >&2
              else
                echo "China mirror blob download failed ($attempt/5): $digest" >&2
              fi
              sleep $((attempt * 5))
            done
            if [ "$verified" != "1" ]; then
              echo "China mirror blob verification failed after retries: $digest" >&2
              exit 1
            fi
          done

          echo "digest=$upstream_digest" >> "$GITHUB_OUTPUT"

          {
            echo "### China mirror image"
            echo
            echo "\`$CHINA_MIRROR_IMAGE\`"
            echo
            echo "Verified digest: \`$upstream_digest\`"
            echo
            echo "Downloaded and SHA-256 verified ${#blob_digests[@]} config/layer blobs from the China mirror."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Record unavailable China mirror without blocking GHCR release
        if: always() && steps.push_release.outcome == 'success' && steps.china_mirror.outcome != 'success'
        env:
          CHINA_MIRROR_IMAGE: ghcr.dockerproxy.net/${{ github.repository }}:${{ github.ref_name }}
        run: |
          echo "::warning::The verified GHCR image was published, but the China pull-through mirror did not respond within bounded retries."
          {
            echo "### China mirror unavailable"
            echo
            echo "The verified GHCR image was published successfully. The pull-through mirror did not return the manifest and is not claimed as deployable:"
            echo
            echo "\`$CHINA_MIRROR_IMAGE\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Anonymous China mirror pull and clean sample runtime smoke
        if: steps.china_mirror.outcome == 'success'
        timeout-minutes: 20
        env:
          CHINA_MIRROR_IMAGE: ghcr.dockerproxy.net/${{ github.repository }}:${{ github.ref_name }}
          EXPECTED_IMAGE_DIGEST: ${{ steps.china_mirror.outputs.digest }}
          EXPECTED_APP_VERSION: ${{ github.ref_name }}
          SESSION_SECRET: ci-china-mirror-sample-session-secret-1234567890
          SEED_ADMIN_USERNAME: samplemirroradmin
          SEED_ADMIN_PASSWORD: Codex-Sample-Mirror-Seed-2026!Z
          SMOKE_ADMIN_CHANGED_PASSWORD: Codex-Sample-Mirror-Changed-2026!R
          S3_ACCESS_KEY_ID: samplemirroraccess
          S3_SECRET_ACCESS_KEY: Codex-Sample-Mirror-MinIO-Secret-2026!Z
          OUTBOX_WORKER_TOKEN: ci-china-mirror-outbox-worker-token-1234567890
        run: |
          set -euo pipefail
          anonymous_config="$(mktemp -d)"
          network="hongmeng-sample-mirror-${GITHUB_RUN_ID}"
          postgres_name="hongmeng-sample-mirror-postgres"
          minio_name="hongmeng-sample-mirror-minio"
          app_name="hongmeng-sample-mirror-app"
          cleanup() {
            docker rm -f "$app_name" "$minio_name" "$postgres_name" >/dev/null 2>&1 || true
            docker network rm "$network" >/dev/null 2>&1 || true
            rm -rf "$anonymous_config"
          }
          trap cleanup EXIT

          export DOCKER_CONFIG="$anonymous_config"
          docker pull "$CHINA_MIRROR_IMAGE"
          mirror_repository="${CHINA_MIRROR_IMAGE%:*}"
          mirror_digest="$(docker image inspect --format '{{range .RepoDigests}}{{println .}}{{end}}' "$CHINA_MIRROR_IMAGE" | awk -F@ -v repository="$mirror_repository" '$1 == repository { print $2; exit }')"
          [[ "$EXPECTED_IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$mirror_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          test "$mirror_digest" = "$EXPECTED_IMAGE_DIGEST"
          test "$(docker image inspect --format '{{.Os}}/{{.Architecture}}' "$CHINA_MIRROR_IMAGE")" = "linux/amd64"
          test "$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.version"}}' "$CHINA_MIRROR_IMAGE")" = "$EXPECTED_APP_VERSION"
          test "$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' "$CHINA_MIRROR_IMAGE")" = "$GITHUB_SHA"

          docker network create "$network" >/dev/null
          docker run -d --name "$postgres_name" --network "$network" --tmpfs /var/lib/postgresql/data \
            -e POSTGRES_USER=postgres \
            -e POSTGRES_PASSWORD=postgres \
            -e POSTGRES_DB=hongmeng_sample_mirror \
            postgres:16-alpine >/dev/null
          docker run -d --name "$minio_name" --network "$network" --tmpfs /data \
            -p 127.0.0.1:29000:9000 \
            -e MINIO_ROOT_USER="$S3_ACCESS_KEY_ID" \
            -e MINIO_ROOT_PASSWORD="$S3_SECRET_ACCESS_KEY" \
            minio/minio:latest server /data --address :9000 --console-address :9001 >/dev/null

          postgres_ready=0
          for attempt in $(seq 1 40); do
            if docker exec "$postgres_name" pg_isready -U postgres -d hongmeng_sample_mirror >/dev/null 2>&1; then
              postgres_ready=1
              break
            fi
            sleep 2
          done
          if [ "$postgres_ready" != "1" ]; then
            docker logs "$postgres_name"
            exit 1
          fi

          minio_ready=0
          for attempt in $(seq 1 40); do
            if docker run --rm --network "$network" minio/mc:latest \
              alias set sample "http://${minio_name}:9000" "$S3_ACCESS_KEY_ID" "$S3_SECRET_ACCESS_KEY" >/dev/null 2>&1; then
              minio_ready=1
              break
            fi
            sleep 2
          done
          if [ "$minio_ready" != "1" ]; then
            docker logs "$minio_name"
            exit 1
          fi
          docker run --rm --network "$network" --entrypoint /bin/sh minio/mc:latest -c \
            "mc alias set sample http://${minio_name}:9000 '$S3_ACCESS_KEY_ID' '$S3_SECRET_ACCESS_KEY' >/dev/null && mc mb -p sample/workorder-resources"

          docker run -d --name "$app_name" --network "$network" -p 127.0.0.1:3300:3000 \
            -e APP_BASE_URL=http://127.0.0.1:3300 \
            -e DATABASE_URL="postgresql://postgres:postgres@${postgres_name}:5432/hongmeng_sample_mirror?schema=public" \
            -e SESSION_SECRET="$SESSION_SECRET" \
            -e SEED_ADMIN_USERNAME="$SEED_ADMIN_USERNAME" \
            -e SEED_ADMIN_PASSWORD="$SEED_ADMIN_PASSWORD" \
            -e S3_ENDPOINT="http://${minio_name}:9000" \
            -e S3_PUBLIC_ENDPOINT=http://127.0.0.1:29000 \
            -e S3_REGION=auto \
            -e S3_BUCKET=workorder-resources \
            -e S3_ACCESS_KEY_ID="$S3_ACCESS_KEY_ID" \
            -e S3_SECRET_ACCESS_KEY="$S3_SECRET_ACCESS_KEY" \
            -e S3_FORCE_PATH_STYLE=true \
            -e PROCESS_ROUTE_CHANGE_OUTBOX_WORKER_TOKEN="$OUTBOX_WORKER_TOKEN" \
            -e PROCESS_ROUTE_CHANGE_OUTBOX_POLL_SECONDS=2 \
            "$CHINA_MIRROR_IMAGE" >/dev/null

          app_ready=0
          for attempt in $(seq 1 90); do
            if curl --fail --silent --show-error http://127.0.0.1:3300/api/ready >/dev/null; then
              app_ready=1
              break
            fi
            sleep 2
          done
          if [ "$app_ready" != "1" ]; then
            docker logs "$app_name"
            exit 1
          fi

          SAMPLE_QA_BASE=http://127.0.0.1:3300 \
            SAMPLE_QA_ALLOW_DISPOSABLE_MUTATION=clean-ci-runtime \
            EXPECTED_APP_VERSION="$EXPECTED_APP_VERSION" \
            SMOKE_ADMIN_USERNAME="$SEED_ADMIN_USERNAME" \
            SMOKE_ADMIN_PASSWORD="$SEED_ADMIN_PASSWORD" \
            SMOKE_ADMIN_CHANGED_PASSWORD="$SMOKE_ADMIN_CHANGED_PASSWORD" \
            node scripts/smoke-sample-capture.mjs

          docker stop --time 20 "$app_name" >/dev/null
          test "$(docker inspect -f '{{.State.ExitCode}}' "$app_name")" = "0"
          {
            echo "### Anonymous China mirror runtime acceptance"
            echo
            echo "Pulled the complete image anonymously with an empty Docker config, verified linux/amd64 and digest \`$mirror_digest\`, then started it against disposable PostgreSQL and MinIO and passed the sample capture lifecycle smoke."
          } >> "$GITHUB_STEP_SUMMARY"
