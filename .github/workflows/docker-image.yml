name: Docker Image
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
concurrency:
  group: docker-image-release
  cancel-in-progress: true
permissions:
  contents: read
  packages: write
jobs:
  build-and-push:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: hongmeng_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d hongmeng_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/hongmeng_ci?schema=public
      DAILY_PLAN_ENABLED: "true"
      # Prepared and digest-verified before the expensive application checks.
      CI_MINIO_IMAGE: hongmeng-ci-minio:verified-a1a8bd4ac40a
    steps:
      - uses: actions/checkout@v4
      - name: Prepare pinned object-storage test image
        run: bash scripts/pull-ci-minio.sh
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Verify release tag matches package version
        run: |
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          test "$GITHUB_REF_NAME" = "v$PACKAGE_VERSION"
      - name: Install dependencies
        run: npm ci
      - name: Validate Prisma schema
        run: npx prisma validate
      - name: Generate Prisma client
        run: npx prisma generate
      - name: Apply Prisma migrations
        run: npx prisma migrate deploy
      - name: Verify Prisma migration status
        run: npx prisma migrate status
      - name: Process inspection reporting PostgreSQL integration
        env:
          RUN_DB_INTEGRATION: "1"
          PROCESS_QUALITY_QA_ALLOW: disposable-quality-reporting-runtime
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/hongmeng_process_quality_ci?schema=public
        run: |
          PGPASSWORD=postgres psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 -c 'CREATE DATABASE hongmeng_process_quality_ci'
          npx prisma migrate deploy
          npx tsx --test --test-concurrency=1 tests/process-quality-integration.test.ts
      - name: Quality quick lifecycle PostgreSQL integration
        env:
          RUN_DB_INTEGRATION: "1"
        run: npx tsx --test --test-concurrency=1 tests/quality-quick-integration.test.ts tests/quality-drawing-integration.test.ts
      - name: Production control pause and date PostgreSQL integration
        env:
          RUN_DB_INTEGRATION: "1"
        run: npx tsx --test --test-concurrency=1 tests/production-control-integration.test.ts
      - name: Training QR and feedback PostgreSQL integration
        env:
          RUN_DB_INTEGRATION: "1"
        run: npm run test:training-integration
      - name: Skill reference catalog PostgreSQL integration
        env:
          RUN_DB_INTEGRATION: "1"
        run: npm run test:skill-integration
      - name: Attendance business calendar PostgreSQL integration
        env:
          RUN_DB_INTEGRATION: "1"
        run: npm run test:attendance-calendar-integration
      - name: Daily plan PostgreSQL integration
        env:
          RUN_DB_INTEGRATION: "1"
        run: npm run test:daily-plan-integration
      - name: Daily shipment PostgreSQL integration
        env:
          RUN_DB_INTEGRATION: "1"
        run: npm run test:daily-shipment-integration
      - name: Finished goods PostgreSQL integration
        env:
          RUN_DB_INTEGRATION: "1"
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/hongmeng_finished_goods_ci?schema=public
        run: |
          PGPASSWORD=postgres psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 -c 'CREATE DATABASE hongmeng_finished_goods_ci'
          npx prisma migrate deploy
          npx tsx --test --test-concurrency=1 tests/finished-goods-integration.test.ts
      - name: Issue work order PostgreSQL integration
        env:
          RUN_DB_INTEGRATION: "1"
        run: npm run test:issue-work-order-integration
      - name: Issue closure PostgreSQL integration
        env:
          RUN_DB_INTEGRATION: "1"
        run: npx tsx --test --test-concurrency=1 tests/issues.test.ts
      - name: 8D PDF archive PostgreSQL integration
        env:
          RUN_DB_INTEGRATION: "1"
        run: npm run test:eight-d-integration
      - name: Internal quality risk PostgreSQL integration
        env:
          RUN_DB_INTEGRATION: "1"
        run: npm run test:quality-risk-integration
      - name: Material library PostgreSQL integration
        env:
          RUN_DB_INTEGRATION: "1"
        run: npm run test:material-library-integration
      - name: Major quality approval PostgreSQL integration
        env:
          RUN_DB_INTEGRATION: "1"
        run: npx tsx --test --test-concurrency=1 tests/major-quality-approval-integration.test.ts
      - name: Employee password field-report PostgreSQL integration
        env:
          RUN_DB_INTEGRATION: "1"
        run: npx tsx --test --test-concurrency=1 tests/field-report-password-integration.test.ts
      - name: Duration-only abnormal-time PostgreSQL integration
        env:
          RUN_DB_INTEGRATION: "1"
        run: npx tsx --test --test-concurrency=1 tests/field-abnormal-time-integration.test.ts tests/abnormal-time-duration-review-integration.test.ts
      - name: QR traveler print PostgreSQL integration
        env:
          RUN_DB_INTEGRATION: "1"
        run: npx tsx --test --test-concurrency=1 tests/field-report-qr-integration.test.ts
      - name: Warehouse and material follow-up PostgreSQL integration
        env:
          RUN_DB_INTEGRATION: "1"
        run: npm run test:material-follow-up-integration
      - name: Warehouse and material follow-up consistency audit
        run: npm run audit:material-follow-up-sync -- --json
      - name: Employee number reorder PostgreSQL integration
        env:
          RUN_EMPLOYEE_REORDER_INTEGRATION: "1"
        run: npm run test:employee-number-integration
      - name: Production plan auto-release PostgreSQL integration
        env:
          RUN_DB_INTEGRATION: "1"
        run: npm run test:planning-integration
      - name: Semi-finished warehouse PostgreSQL integration
        env:
          RUN_DB_INTEGRATION: "1"
        run: npx tsx --test --test-concurrency=1 tests/material-execution-control-integration.test.ts tests/wip-warehouse-integration.test.ts tests/wip-attainment-integration.test.ts tests/production-wip-source-projection-integration.test.ts
      - name: Production carryover and test-week retirement PostgreSQL integration
        env:
          RUN_DB_INTEGRATION: "1"
        run: npx tsx --test --test-concurrency=1 tests/production-carryover.test.ts tests/production-carryover-integration.test.ts tests/production-test-data-retirement-integration.test.ts
      - name: Weekly plan Excel export PostgreSQL integration
        env:
          RUN_DB_INTEGRATION: "1"
        run: npm run test:weekly-plan-export-integration
      - name: Production correction and product-time sync PostgreSQL integration
        env:
          RUN_DB_INTEGRATION: "1"
        run: npx tsx --test --test-concurrency=1 tests/process-completion-withdrawal-integration.test.ts tests/product-time-active-sync-integration.test.ts tests/product-time-draft-sync-integration.test.ts tests/product-time-draft-rebuild-integration.test.ts tests/product-time-route-confirmation-repair-integration.test.ts
      - name: Process route change PostgreSQL integration
        env:
          RUN_DB_INTEGRATION: "1"
        run: npx tsx --test --test-concurrency=1 tests/process-route-change-integration.test.ts tests/process-route-change-review-lifecycle-integration.test.ts tests/process-route-change-move-integration.test.ts tests/process-route-change-duplicate-occurrence-integration.test.ts tests/process-completion-supplement-flow-integration.test.ts tests/product-time-full-deployment-integration.test.ts tests/product-time-in-progress-migration-integration.test.ts tests/product-time-supplement-anchor-integration.test.ts tests/full-workorder-supplement-rebaseline-integration.test.ts tests/product-time-deployment-version-conflict-integration.test.ts
      - name: Reporting recovery contract and receipt PostgreSQL integration
        env:
          RUN_DB_INTEGRATION: "1"
        run: npx tsx --test --test-concurrency=1 tests/process-report-contract-integration.test.ts tests/process-report-submissions-integration.test.ts tests/process-report-submission-compound-integration.test.ts
      - name: Unequal WIP recovery and process replacement scope integration
        env:
          RUN_DB_INTEGRATION: "1"
        run: npx tsx --test --test-concurrency=1 tests/wip-partial-recovery-integration.test.ts tests/product-time-replacement-scope-integration.test.ts
      - name: System notification lifecycle PostgreSQL integration
        env:
          RUN_DB_INTEGRATION: "1"
        run: npx tsx --test --test-concurrency=1 tests/system-notification-lifecycle-integration.test.ts tests/process-route-notification-lifecycle-integration.test.ts
      - name: Advance reporting and automatic labor PostgreSQL integration
        env:
          RUN_DB_INTEGRATION: "1"
        run: npx tsx --test --test-concurrency=1 tests/advance-reporting-integration.test.ts tests/process-action-reporting-integration.test.ts
      - name: Terminal tooling PostgreSQL integration
        env:
          RUN_DB_INTEGRATION: "1"
        run: npx tsx --test --test-concurrency=1 tests/terminal-tooling-integration.test.ts tests/terminal-tooling-four-specs-integration.test.ts
      - name: Sample team PostgreSQL integration
        env:
          RUN_DB_INTEGRATION: "1"
        run: npm run test:sample-integration
      - name: Type check
        run: npx tsc --noEmit
      - name: Employee hours and proportional batch labor PostgreSQL integration
        env:
          RUN_DB_INTEGRATION: "1"
        run: npx tsx --test --test-concurrency=1 tests/employee-hours-report-integration.test.ts tests/batch-labor-proportional-integration.test.ts
      - name: Other work hours approval and report PostgreSQL integration
        env:
          RUN_DB_INTEGRATION: "1"
        run: npx tsx --test --test-concurrency=1 tests/other-work-hours-integration.test.ts
      - name: Employee attainment effective-date PostgreSQL integration
        env:
          RUN_DB_INTEGRATION: "1"
        run: npx tsx --test --test-concurrency=1 tests/employee-attainment-policy-integration.test.ts
      - name: Pending report coverage PostgreSQL integration
        env:
          RUN_DB_INTEGRATION: "1"
        run: npx tsx --test --test-concurrency=1 tests/process-pending-coverage-recovery-integration.test.ts tests/process-flexible-route-closure-integration.test.ts
      - name: Production collaboration PostgreSQL integration
        env:
          RUN_DB_INTEGRATION: "1"
        run: npx tsx --test --test-concurrency=1 tests/wip-route-edit-integration.test.ts tests/wip-material-route-integration.test.ts tests/production-snapshot-integration.test.ts tests/production-wip-execution-state-integration.test.ts
      - name: Quality data PostgreSQL lifecycle integration
        env:
          RUN_DB_INTEGRATION: "1"
        run: npx tsx --test --test-concurrency=1 tests/quality-data-integration.test.ts tests/quality-reference-integration.test.ts tests/quality-paper-integration.test.ts
      - name: Lint
        run: npm run lint
      - name: Drawing archive identity and administrator lifecycle PostgreSQL integration
        env:
          DRAWING_LIBRARY_QA_ALLOW: disposable-drawing-runtime
        run: npx tsx --test --test-concurrency=1 tests/drawing-library-admin-integration.test.ts
      - name: Performance regression contracts
        run: npx tsx --test tests/performance-regression-contract.test.ts tests/performance-request.test.ts tests/http-byte-range.test.ts tests/database-performance-config.test.ts
      - name: Unit tests
        run: npm run test:unit
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=tag
            type=raw,value=latest
            type=sha
          labels: |
            org.opencontainers.image.title=hongmeng-workorder-resource
            org.opencontainers.image.version=${{ github.ref_name }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          build-args: |
            APP_VERSION=${{ github.ref_name }}
            APP_REVISION=${{ github.sha }}
          load: true
          push: false
          tags: hongmeng-release-smoke:${{ github.sha }}
          labels: ${{ steps.meta.outputs.labels }}
      - name: Verify PDF.js runtime assets
        run: |
          docker run --rm --entrypoint /bin/sh hongmeng-release-smoke:${{ github.sha }} -c \
            'test -s /app/node_modules/pdfjs-dist/legacy/build/pdf.worker.mjs && test -s /app/node_modules/pdfjs-dist/legacy/build/pdf.worker.min.mjs'
      - name: Verify runtime origin guard
        run: |
          docker run --rm --entrypoint node \
            -e APP_BASE_URL=https://example.com \
            hongmeng-release-smoke:${{ github.sha }} scripts/validate-runtime-env.mjs
          if docker run --rm --entrypoint node \
            -e APP_BASE_URL=http://https://example.com \
            hongmeng-release-smoke:${{ github.sha }} scripts/validate-runtime-env.mjs; then
            echo "Malformed APP_BASE_URL was accepted" >&2
            exit 1
          fi
      - name: Smoke test exact release image
        env:
          OUTBOX_WORKER_TOKEN: ci-process-route-change-outbox-worker-token-1234567890
          SESSION_SECRET: ci-release-smoke-session-secret-1234567890
          SEED_ADMIN_USERNAME: pdfsmokeadmin
          SEED_ADMIN_PASSWORD: Codex-V13415-CI-Seed-Password-2026!Z
          SMOKE_ADMIN_CHANGED_PASSWORD: Codex-PDF-Smoke-Changed-2026!R
          S3_ACCESS_KEY_ID: pdfsmokeaccess
          S3_SECRET_ACCESS_KEY: Codex-V13415-MinIO-Secret-2026!Z
        run: |
          docker run -d --name hongmeng-release-minio --network host \
            -e MINIO_ROOT_USER="$S3_ACCESS_KEY_ID" \
            -e MINIO_ROOT_PASSWORD="$S3_SECRET_ACCESS_KEY" \
            "$CI_MINIO_IMAGE" server /data --address :19000 --console-address :19001
          cleanup() {
            docker rm -f hongmeng-release-smoke >/dev/null 2>&1 || true
            docker rm -f hongmeng-release-minio >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          if ! SMOKE_STORAGE_ALLOW=disposable-ci-storage \
            S3_ENDPOINT=http://127.0.0.1:19000 S3_BUCKET=workorder-resources \
            node scripts/prepare-smoke-storage.mjs; then
            docker logs hongmeng-release-minio
            exit 1
          fi
          docker run -d --name hongmeng-release-smoke --network host \
            -e DATABASE_URL="$DATABASE_URL" \
            -e SESSION_SECRET="$SESSION_SECRET" \
            -e SEED_ADMIN_USERNAME="$SEED_ADMIN_USERNAME" \
            -e SEED_ADMIN_PASSWORD="$SEED_ADMIN_PASSWORD" \
            -e S3_ENDPOINT=http://127.0.0.1:19000 \
            -e S3_PUBLIC_ENDPOINT=http://127.0.0.1:19000 \
            -e S3_REGION=auto \
            -e S3_BUCKET=workorder-resources \
            -e S3_ACCESS_KEY_ID="$S3_ACCESS_KEY_ID" \
            -e S3_SECRET_ACCESS_KEY="$S3_SECRET_ACCESS_KEY" \
            -e S3_FORCE_PATH_STYLE=true \
            -e PROCESS_ROUTE_CHANGE_OUTBOX_WORKER_TOKEN="$OUTBOX_WORKER_TOKEN" \
            -e PROCESS_ROUTE_CHANGE_OUTBOX_POLL_SECONDS=600 \
            hongmeng-release-smoke:${{ github.sha }}
          ready=0
          for attempt in $(seq 1 60); do
            if curl --fail --silent --show-error http://127.0.0.1:3000/login >/dev/null; then
              ready=1
              break
            fi
            sleep 2
          done
          if [ "$ready" != "1" ]; then
            docker logs hongmeng-release-smoke
            exit 1
          fi
          curl --fail --silent --show-error \
            -X POST \
            -H "x-outbox-worker-token: $OUTBOX_WORKER_TOKEN" \
            http://127.0.0.1:3000/api/internal/process-route-change-outbox >/dev/null
          APP_BASE_URL=http://127.0.0.1:3000 \
            SMOKE_ADMIN_USERNAME="$SEED_ADMIN_USERNAME" \
            SMOKE_ADMIN_PASSWORD="$SEED_ADMIN_PASSWORD" \
            SMOKE_ADMIN_CHANGED_PASSWORD="$SMOKE_ADMIN_CHANGED_PASSWORD" \
            node scripts/smoke-connector-manual-pdf.mjs
          REPORT_QA_BASE=http://127.0.0.1:3000 \
            REPORT_QA_S3_ENDPOINT=http://127.0.0.1:19000 \
            REPORT_QA_EVIDENCE_PATH=artifacts/employee-reports-access-v13466/runtime-ci.json \
            node scripts/smoke-employee-reports-access.mjs
          ORIENTATION_QA_BASE=http://127.0.0.1:3000 \
            ORIENTATION_QA_EVIDENCE=artifacts/document-orientation-v13467/runtime-ci.json \
            node scripts/smoke-document-orientation.mjs
          CONTROL_QA_BASE=http://127.0.0.1:3000 \
            CONTROL_QA_EVIDENCE=artifacts/production-control-v13469/runtime-ci.json \
            node scripts/smoke-production-control.mjs
          ISSUE_QA_BASE=http://127.0.0.1:3000 \
            ISSUE_QA_EVIDENCE=artifacts/issue-closure-v13470/runtime-ci.json \
            node scripts/smoke-issue-closure.mjs
          DATABASE_URL=postgresql://postgres:postgres@localhost:5432/hongmeng_ci \
            WECOM_QA_BASE=http://127.0.0.1:3000 \
            PROCESS_ROUTE_CHANGE_OUTBOX_WORKER_TOKEN="$OUTBOX_WORKER_TOKEN" \
            node scripts/smoke-wecom-quality-only.mjs
          mkdir -p artifacts/quality-data-v1
          docker exec -i -e QUALITY_DATA_QA_ALLOW=disposable-quality-runtime hongmeng-release-smoke node \
            < scripts/seed-quality-data-smoke.cjs > artifacts/quality-data-v1/release-fixture.json
          QUALITY_DATA_QA_BASE=http://127.0.0.1:3000 \
            QUALITY_DATA_QA_ALLOW=disposable-quality-runtime \
            QUALITY_DATA_QA_FIXTURE=artifacts/quality-data-v1/release-fixture.json \
            QUALITY_DATA_QA_OUTPUT=artifacts/quality-data-v1/release-runtime.json \
            node scripts/smoke-quality-data.mjs
          QUALITY_DATA_QA_BASE=http://127.0.0.1:3000 \
            QUALITY_DATA_QA_ALLOW=disposable-quality-runtime \
            QUALITY_DATA_QA_FIXTURE=artifacts/quality-data-v1/release-fixture.json \
            QUALITY_PAPER_QA_OUTPUT=artifacts/quality-data-v1/release-paper-runtime.json \
            node scripts/smoke-quality-paper.mjs
          mkdir -p artifacts/planning-progress-preview
          docker exec -i -e QUALITY_DATA_QA_ALLOW=disposable-quality-runtime hongmeng-release-smoke node \
            < scripts/seed-planning-import-smoke.cjs > artifacts/planning-progress-preview/release-reference.json
          QUALITY_DATA_QA_BASE=http://127.0.0.1:3000 \
            QUALITY_DATA_QA_ALLOW=disposable-quality-runtime \
            QUALITY_DATA_QA_FIXTURE=artifacts/quality-data-v1/release-fixture.json \
            PLANNING_IMPORT_QA_OUTPUT=artifacts/planning-progress-preview/release-import-runtime.json \
            PLANNING_IMPORT_QA_REFERENCE=artifacts/planning-progress-preview/release-reference.json \
            node scripts/smoke-planning-import.mjs
          RUN_DB_INTEGRATION=1 \
            PROCESS_PENDING_RECOVERY_TEST_ORIGIN=http://127.0.0.1:3000 \
            PROCESS_ROUTE_CHANGE_OUTBOX_WORKER_TOKEN="$OUTBOX_WORKER_TOKEN" \
            npx tsx --test --test-concurrency=1 --test-name-pattern=historical-recovery tests/process-pending-coverage-recovery-integration.test.ts \
            | tee artifacts/planning-progress-preview/release-worker-runtime.log
          RUN_DB_INTEGRATION=1 \
            PROCESS_PENDING_RECOVERY_TEST_ORIGIN=http://127.0.0.1:3000 \
            PROCESS_ROUTE_CHANGE_OUTBOX_WORKER_TOKEN="$OUTBOX_WORKER_TOKEN" \
            npx tsx --test --test-concurrency=1 tests/wip-route-edit-integration.test.ts \
            | tee artifacts/planning-progress-preview/release-flexible-route-runtime.log
          RUN_DB_INTEGRATION=1 \
            PROCESS_PENDING_RECOVERY_TEST_ORIGIN=http://127.0.0.1:3000 \
            PROCESS_ROUTE_CHANGE_OUTBOX_WORKER_TOKEN="$OUTBOX_WORKER_TOKEN" \
            npx tsx --test --test-concurrency=1 --test-name-pattern='006:|without audited' tests/process-flexible-route-closure-integration.test.ts \
            | tee artifacts/planning-progress-preview/release-partial-closure-runtime.log
          mkdir -p artifacts/production-collaboration
          docker exec -i -e QUALITY_DATA_QA_ALLOW=disposable-quality-runtime hongmeng-release-smoke node \
            < scripts/seed-production-board-smoke.cjs > artifacts/production-collaboration/fixture.json
          npx --yes --package @playwright/cli@0.1.19 playwright-cli install-browser chrome
          PRODUCTION_BOARD_QA_BASE=http://127.0.0.1:3000 \
            PRODUCTION_BOARD_QA_FIXTURE=artifacts/production-collaboration/fixture.json \
            node scripts/smoke-production-board-browser.mjs
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk
          mkdir -p artifacts/process-quality
          docker exec -i -e PROCESS_QUALITY_QA_ALLOW=disposable-quality-reporting-runtime hongmeng-release-smoke node \
            < scripts/seed-process-quality-smoke.cjs > artifacts/process-quality/fixture.json
          PROCESS_QUALITY_QA_ALLOW=disposable-quality-reporting-runtime \
            PROCESS_QUALITY_QA_FIXTURE=artifacts/process-quality/fixture.json \
            PROCESS_QUALITY_QA_OUTPUT=artifacts/process-quality/release-http.json \
            node scripts/smoke-process-quality.mjs
          PROCESS_QUALITY_QA_FIXTURE=artifacts/process-quality/fixture.json \
            node scripts/smoke-process-quality-browser.mjs
          mkdir -p artifacts/quality-workbench
          docker exec -i -e QUALITY_WORKBENCH_QA_ALLOW=disposable-quality-runtime hongmeng-release-smoke node \
            < scripts/seed-quality-workbench-smoke.cjs > artifacts/quality-workbench/release-fixture.json
          QUALITY_WORKBENCH_QA_BASE=http://127.0.0.1:3000 \
            QUALITY_WORKBENCH_QA_ALLOW=disposable-quality-runtime \
            QUALITY_WORKBENCH_QA_FIXTURE=artifacts/quality-workbench/release-fixture.json \
            QUALITY_WORKBENCH_QA_OUTPUT=artifacts/quality-workbench/release-http.json \
            node scripts/smoke-quality-workbench.mjs
          QUALITY_WORKBENCH_QA_BASE=http://127.0.0.1:3000 \
            QUALITY_WORKBENCH_QA_FIXTURE=artifacts/quality-workbench/release-fixture.json \
            node scripts/smoke-quality-workbench-browser.mjs
          mkdir -p artifacts/terminal-tooling
          docker exec -i -e TOOLING_QA_ALLOW=disposable-tooling-runtime hongmeng-release-smoke node \
            < scripts/seed-terminal-tooling-smoke.cjs > artifacts/terminal-tooling/release-fixture.json
          TOOLING_QA_ALLOW=disposable-tooling-runtime \
            TOOLING_QA_BASE=http://127.0.0.1:3000 \
            TOOLING_QA_FIXTURE=artifacts/terminal-tooling/release-fixture.json \
            TOOLING_QA_OUTPUT=artifacts/terminal-tooling/release-http.json \
            node scripts/smoke-terminal-tooling.mjs
          TOOLING_QA_ALLOW=disposable-tooling-runtime \
            TOOLING_QA_BASE=http://127.0.0.1:3000 \
            TOOLING_QA_FIXTURE=artifacts/terminal-tooling/release-fixture.json \
            TOOLING_QA_BROWSER_OUTPUT=artifacts/terminal-tooling/release-browser \
            node scripts/smoke-terminal-tooling-browser.mjs
          mkdir -p artifacts/reporting-recovery
          docker exec -i -e REPORT_RECOVERY_QA_ALLOW=disposable-reporting-runtime hongmeng-release-smoke node \
            < scripts/seed-reporting-recovery-smoke.cjs > artifacts/reporting-recovery/release-fixture.json
          REPORT_RECOVERY_QA_ALLOW=disposable-reporting-runtime \
            REPORT_RECOVERY_QA_BASE=http://127.0.0.1:3000 \
            REPORT_RECOVERY_QA_FIXTURE=artifacts/reporting-recovery/release-fixture.json \
            REPORT_RECOVERY_QA_OUTPUT=artifacts/reporting-recovery/release-http.json \
            node scripts/smoke-reporting-recovery.mjs
          REPORT_RECOVERY_QA_ALLOW=disposable-reporting-runtime \
