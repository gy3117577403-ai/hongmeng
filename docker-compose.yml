services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-workorder_resource}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a strong URL-safe POSTGRES_PASSWORD in .env}
    ports: ["5432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:?Set S3_ACCESS_KEY_ID in .env}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:?Set a strong S3_SECRET_ACCESS_KEY in .env}
    ports: ["9000:9000","9001:9001"]
    volumes: ["minio_data:/data"]
  minio-init:
    image: minio/mc:latest
    depends_on: [minio]
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:?Set S3_ACCESS_KEY_ID in .env}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:?Set a strong S3_SECRET_ACCESS_KEY in .env}
    entrypoint: /bin/sh -c 'sleep 5; mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"; mc mb -p local/workorder-resources || true; exit 0;'
  app:
    build: .
    restart: unless-stopped
    depends_on: [db, minio-init]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?Set a strong URL-safe POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-workorder_resource}?schema=public
      SESSION_SECRET: ${SESSION_SECRET:?Set a random SESSION_SECRET of at least 32 characters in .env}
      FIELD_REPORT_PIN_PEPPER: ${FIELD_REPORT_PIN_PEPPER:?Set a separate random FIELD_REPORT_PIN_PEPPER of at least 32 characters in .env}
      S3_ENDPOINT: http://minio:9000
      S3_PUBLIC_ENDPOINT: http://localhost:9000
      S3_REGION: auto
      S3_BUCKET: workorder-resources
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?Set S3_ACCESS_KEY_ID in .env}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?Set a strong S3_SECRET_ACCESS_KEY in .env}
      S3_FORCE_PATH_STYLE: "true"
      APP_BASE_URL: http://localhost:3000
      MAX_UPLOAD_SIZE_MB: "50"
      SEED_ADMIN_USERNAME: ${SEED_ADMIN_USERNAME:-admin}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-}
      SEED_RESET_ADMIN_PASSWORD: ${SEED_RESET_ADMIN_PASSWORD:-false}
    ports: ["3000:3000"]
volumes:
  postgres_data:
  minio_data:
